# Node 2 — joins Raft via http://172.28.7.11:8000
services:
  back:
    container_name: skylogs_back-2
    env_file:
      - ha/node.env
    environment:
      - HA_ENABLED=true
      - HA_NODE_ID=node-2
      - HA_NODE_SECRET=changeme-ha-secret
      - RAFT_URL=http://raft:8000
      - HA_PEER_URLS=172.28.7.11=http://nginx-1:80,172.28.7.12=http://nginx-2:80,172.28.7.13=http://nginx-3:80
    networks: !override
      skylogs_net:
      skylogs_ha:

  nginx:
    container_name: nginx-2
    ports: !override
      - "8183:80"
    networks: !override
      skylogs_net:
      skylogs_ha:

  mongo:
    ports: !override
      - "27118:27017"

  redis:
    ports: !override
      - "6480:6379"

  horizon:
    container_name: skylogs_horizon-2
    env_file:
      - ha/node.env
    environment:
      - HA_ENABLED=true
      - HA_NODE_ID=node-2
      - HA_NODE_SECRET=changeme-ha-secret
      - RAFT_URL=http://raft:8000
      - HA_PEER_URLS=172.28.7.11=http://nginx-1:80,172.28.7.12=http://nginx-2:80,172.28.7.13=http://nginx-3:80
    networks: !override
      skylogs_net:
      skylogs_ha:

  raft:
    container_name: skylogs_raft-2
    environment: !override
      - RAFT_NODE_ID=node2
      - RAFT_ADV_ADDR=172.28.7.12
      - RAFT_START_MODE=--join http://172.28.7.11:8000
      - RAFT_NOTIFY_URL=http://nginx:80/api/ha/apply
      - RAFT_NOTIFY_SECRET=changeme-ha-secret
      - RAFT_NOTIFY_HEADER=X-Skylogs-HA-Secret
    ports: !override
      - "8802:8000"
    networks: !override
      skylogs_net:
      skylogs_ha:
        ipv4_address: 172.28.7.12

networks:
  skylogs_ha:
    external: true
