global
  log stdout format raw local0
  maxconn 2000

defaults
  log global
  mode http
  option httplog
  timeout connect 3s
  timeout client  30s
  timeout server  30s

frontend raft_vip
  bind :8000
  default_backend raft_nodes

backend raft_nodes
  balance roundrobin

  # Only the current leader should pass health checks (leader => 200, follower => 503).
  # Note: in this build `/health` returns 404, but `/leader` has the correct semantics.
  option httpchk GET /leader
  http-check expect status 200

  server node1 172.28.7.11:8000 check
  server node2 172.28.7.12:8000 check
  server node3 172.28.7.13:8000 check

