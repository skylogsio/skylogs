# Node 3 — joins Raft via http://172.28.7.11:8000
services:
  back:
    container_name: skylogs_back-3
    env_file:
      - ha/node.env
    environment:
      - HA_ENABLED=true
      - HA_NODE_ID=node-3
      - HA_NODE_SECRET=changeme-ha-secret
      - RAFT_URL=http://raft:8000
      - HA_PEER_URLS=172.28.7.11=http://nginx-1:80,172.28.7.12=http://nginx-2:80,172.28.7.13=http://nginx-3:80
    networks: !override
      skylogs_net:
      skylogs_ha:

  nginx:
    container_name: nginx-3
    ports: !override
      - "8283:80"
    networks: !override
      skylogs_net:
      skylogs_ha:

  mongo:
    ports: !override
      - "27119:27017"

  redis:
    ports: !override
      - "6481:6379"

  horizon:
    container_name: skylogs_horizon-3
    env_file:
      - ha/node.env
    environment:
      - HA_ENABLED=true
      - HA_NODE_ID=node-3
      - HA_NODE_SECRET=changeme-ha-secret
      - RAFT_URL=http://raft:8000
      - HA_PEER_URLS=172.28.7.11=http://nginx-1:80,172.28.7.12=http://nginx-2:80,172.28.7.13=http://nginx-3:80
    networks: !override
      skylogs_net:
      skylogs_ha:

  raft:
    container_name: skylogs_raft-3
    environment: !override
      - RAFT_NODE_ID=node3
      - RAFT_ADV_ADDR=172.28.7.13
      - RAFT_START_MODE=--join http://172.28.7.11:8000
      - VIP=172.28.7.10
      - RAFT_NOTIFY_URL=http://nginx:80/api/ha/apply
      - RAFT_NOTIFY_SECRET=changeme-ha-secret
      - RAFT_NOTIFY_HEADER=X-Skylogs-HA-Secret
    ports: !override
      - "8803:8000"

    networks: !override
      skylogs_net:
      skylogs_ha:
        ipv4_address: 172.28.7.13

networks:
  skylogs_ha:
    external: true
