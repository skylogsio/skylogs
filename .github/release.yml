changelog:
  exclude:
    labels: [dependencies, chore]   # hide dependabot noise
  categories:
    - title: 🚨 Breaking Changes
      labels: [breaking]
    - title: ✨ Features
      labels: [enhancement, feature]
    - title: 🐛 Bug Fixes
      labels: [bug, fix]
    - title: 📚 Documentation
      labels: [documentation]
    - title: Other Changes
      labels: ["*"]
