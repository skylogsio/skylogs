    - NEXTAUTH_SECRET=GK/IKHJ55WUBSIDAFLT3vcQmud1t5PIZHsclw40JtVs=
    - NEXTAUTH_URL=http://localhost:8000
    - BASE_URL=http://nginx:80/api/v1/


services:
  back:
    build: apps/backend
#    container_name: skylogs_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - app_data:/var/www/html
    networks:
      - skylogs_net
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_started
    # Healthy once entrypoint finishes and php-fpm listens (app_data populated).
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9000 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 120s
    <<: *back-env
  
  nginx:
    image: nginx:latest
#    container_name: skylogs_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - app_data:/var/www/html
      - ./apps/backend/nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - skylogs_net
    depends_on:
      - back
  
  mongo:
    image: mongo:latest
#    container_name: skylogs_mongo
    restart: unless-stopped
    ports:
      - "27018:27017"
    networks:
      - skylogs_net
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
  
  redis:
    image: redis:latest
#    container_name: skylogs_redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    networks:
      - skylogs_net
  
  horizon:
    build:
      context: apps/backend
      dockerfile: HorizonDockerfile
#    container_name: skylogs_horizon
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      # Populated by back's entrypoint; starts only after back is healthy.
      - app_data:/var/www/html
    depends_on:
      back:
        condition: service_healthy
      mongo:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - skylogs_net
    <<: *back-env

  
  front:
    build: apps/frontend
    restart: unless-stopped
    ports:
      - 8080:3000
    networks:
      - skylogs_net
    depends_on:
      - nginx
    <<: *front-env
  
  sentinel:
    build: apps/sentinel
#    container_name: sentinel
    restart: always
    depends_on:
      - back
    environment:
      - SENTINEL_ID=dc2-sentinel
      - SENTINEL_ROLE=secondary
      - MAIN_SKYLOGS_HEARTBEAT_URL=http://nginx/heartbeat
      - HEARTBEAT_INTERVAL=5s
      - HEARTBEAT_TIMEOUT=3s
      - FAIL_THRESHOLD=3
      - ALERT_WEBHOOK_URL=http://skylogs-core:8080/internal/alerts/sentinel
    volumes:
      - ./apps/sentinel/config.yaml:/app/config.yaml:ro
    ports:
      - "9191:9191"
    networks:
      - skylogs_net
  
  
  
  raft:
    build: apps/raft
#    container_name: raft
    restart: unless-stopped
    environment:
      - RAFT_NODE_ID=node1
      - RAFT_ADV_ADDR=raft
      - RAFT_START_MODE=--bootstrap
      # This raft's own backend on the same compose network (nginx fronts php-fpm).
      # Multi-node: each raft-N must use http://nginx-N:80/api/ha/apply — never a shared VIP.
      - RAFT_NOTIFY_URL=http://nginx:80/api/ha/apply
      - RAFT_NOTIFY_SECRET=changeme-ha-secret
      - RAFT_NOTIFY_HEADER=X-Skylogs-HA-Secret
    # The entrypoint builds the flags from RAFT_* above: raft TCP 7000, HTTP 8000, data in /data.
    ports:
      - "8001:8000"
    volumes:
      - raft_data:/data
    networks:
      - skylogs_net
    depends_on:
      - nginx

networks:
  skylogs_net:
    driver: bridge

volumes:
  app_data:
  mongo_data:
    driver: local
  raft_data:
    driver: local
