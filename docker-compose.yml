# ---------------------------------------------------------------------------
# Skylogs stack (prebuilt images)
#
#   Local first run. Defaults match .env.example, so no .env is required:
#       docker compose up -d
#
#   Raft HA inside the zone. In .env set COMPOSE_PROFILES=ha and HA_ENABLED=true:
#       docker compose up -d
#
#   Sentinel cross-zone federation. In .env set COMPOSE_PROFILES=multizone:
#       docker compose up -d
#
#   UI:  http://localhost:3000   sign in as admin / 123456
#   API: http://localhost
# ---------------------------------------------------------------------------

x-back-env: &back-env
  environment:
    APP_KEY: "${APP_KEY:-base64:bG9jYWwtZGV2LW9ubHktYXBwLWtleS1jaGFuZ2UhISE=}"
    APP_DEBUG: "${APP_DEBUG:-true}"
    APP_URL: "${APP_URL:-http://localhost}"
    FRONTEND_URL: "${FRONTEND_URL:-http://localhost:3000}"
    DEPLOY_TYPE: "${DEPLOY_TYPE:-web}"
    DB_CONNECTION: "${DB_CONNECTION:-mongodb}"
    DB_HOST: "${DB_HOST:-mongo}"
    DB_PORT: "${DB_PORT:-27017}"
    DB_DATABASE: "${DB_DATABASE:-Skylogs}"
    # Empty unless MONGO_ROOT_USERNAME / MONGO_ROOT_PASSWORD are set in .env.
    DB_USERNAME: "${MONGO_ROOT_USERNAME:-}"
    DB_PASSWORD: "${MONGO_ROOT_PASSWORD:-}"
    DB_AUTHENTICATION_DATABASE: "${DB_AUTHENTICATION_DATABASE:-admin}"
    REDIS_HOST: "${REDIS_HOST:-redis}"
    REDIS_PORT: "${REDIS_PORT:-6379}"
    REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
    REDIS_DB: "${REDIS_DB:-0}"
    REDIS_QUEUE_DB: "${REDIS_QUEUE_DB:-1}"
    REDIS_CACHE_DB: "${REDIS_CACHE_DB:-2}"
    JWT_SECRET: "${JWT_SECRET:-local-dev-jwt-secret-change-me-32b}"
    # Off unless COMPOSE_PROFILES includes ha. The backend reads these names.
    HA_ENABLED: "${HA_ENABLED:-false}"
    HA_NODE_ID: "${HA_NODE_ID:-node1}"
    HA_NODE_SECRET: "${HA_NODE_SECRET:-local-dev-ha-secret}"
    RAFT_URL: "${RAFT_URL:-http://raft:8000}"

x-front-env: &front-env
  environment:
    NEXTAUTH_SECRET: "${NEXTAUTH_SECRET:-local-dev-nextauth-secret-change-me}"
    NEXTAUTH_URL: "${NEXTAUTH_URL:-http://localhost:3000}"
    BASE_URL: "${BASE_URL:-http://nginx/api/v1/}"

services:
  back:
    image: ${IMAGE_TAG_BACK:-skylogsio/skylogs-api:latest}
    restart: unless-stopped
    volumes:
      - back_data:/var/www/html:rw
    networks:
      - skylogs
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Healthy once the entrypoint has copied the app and php-fpm is listening.
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9000 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 120s
    <<: *back-env

  front:
    image: ${IMAGE_TAG_FRONT:-skylogsio/skylogs-frontend:latest}
    restart: unless-stopped
    ports:
      - "3000:3000"
    networks:
      - skylogs
    depends_on:
      - nginx
    <<: *front-env

  horizon:
    image: ${IMAGE_TAG_BACK:-skylogsio/skylogs-api:latest}
    restart: unless-stopped
    command: horizon
    depends_on:
      back:
        condition: service_healthy
      mongo:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - skylogs
    <<: *back-env

  crontab:
    image: ${IMAGE_TAG_BACK:-skylogsio/skylogs-api:latest}
    command: crontab
    restart: unless-stopped
    depends_on:
      back:
        condition: service_healthy
      mongo:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - skylogs
    <<: *back-env

  mongo:
    image: mongo:latest
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: "${MONGO_ROOT_USERNAME:-}"
      MONGO_INITDB_ROOT_PASSWORD: "${MONGO_ROOT_PASSWORD:-}"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet ${MONGO_ROOT_USERNAME:+-u '${MONGO_ROOT_USERNAME}' -p '${MONGO_ROOT_PASSWORD}' --authenticationDatabase admin} --eval 'db.runCommand({ ping: 1 }).ok'",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - skylogs

  redis:
    image: redis:latest
    restart: unless-stopped
    # --requirepass is added only when REDIS_PASSWORD is non-empty.
    command: redis-server --save 60 1 --loglevel warning ${REDIS_PASSWORD:+--requirepass "${REDIS_PASSWORD}"}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ${REDIS_PASSWORD:+-a '${REDIS_PASSWORD}' --no-auth-warning} ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks:
      - skylogs

  nginx:
    image: nginx:latest
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - back_data:/var/www/html:ro
      - ./apps/backend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - skylogs
    depends_on:
      back:
        condition: service_healthy

  # Only starts when the ha profile is enabled. Set HA_ENABLED=true as well.
  raft:
    image: ${IMAGE_TAG_RAFT:-skylogsio/skylogs-raft:latest}
    profiles: ["ha"]
    ports:
      - "7000:7000"
      - "8000:8000"
    environment:
      RAFT_NODE_ID: "${RAFT_NODE_ID:-node1}"
      RAFT_ADV_ADDR: "${RAFT_ADV_ADDR:-raft}"
      RAFT_START_MODE: "${RAFT_START_MODE:---bootstrap}"
      RAFT_NOTIFY_URL: "${RAFT_NOTIFY_URL:-http://nginx:80/api/ha/apply}"
      RAFT_NOTIFY_SECRET: "${HA_NODE_SECRET:-local-dev-ha-secret}"
      RAFT_NOTIFY_HEADER: X-Skylogs-HA-Secret
    volumes:
      - raft_data:/data
    restart: unless-stopped
    networks:
      - skylogs
    depends_on:
      - nginx

  # Only starts when the multizone profile is enabled.
  sentinel:
    image: ${IMAGE_TAG_SENTINEL:-skylogsio/skylogs-sentinel:latest}
    profiles: ["multizone"]
    restart: unless-stopped
    depends_on:
      - back
    environment:
      # Empty id/role keep the values in the mounted config file.
      SENTINEL_ID: "${SENTINEL_ID:-}"
      SENTINEL_ROLE: "${SENTINEL_ROLE:-}"
      MAIN_SENTINEL_URL: "${MAIN_SENTINEL_URL:-}"
      ALERT_BASE_URL: "${ALERT_BASE_URL:-http://nginx}"
      HEARTBEAT_INTERVAL: "${HEARTBEAT_INTERVAL:-5s}"
      HEARTBEAT_TIMEOUT: "${HEARTBEAT_TIMEOUT:-3s}"
      HEARTBEAT_FAIL_AFTER: "${HEARTBEAT_FAIL_AFTER:-15s}"
    volumes:
      - ./apps/sentinel/config.yaml:/app/config.yaml:ro
    ports:
      - "9191:9191"
    networks:
      - skylogs

networks:
  skylogs:
    driver: bridge

volumes:
  back_data:
    driver: local
  mongo_data:
    driver: local
  raft_data:
    driver: local
