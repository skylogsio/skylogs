    - APP_ENV=local
    - APP_DEBUG=true
    - APP_URL=http://localhost:8000
    - FRONTEND_URL=http://localhost:8080
    - KAVENEGAR_TOKEN=
    - KAVENEGAR_SENDER_NUMBER=
    - TELEGRAM_BOT_TOKEN=
    #  High availability. Off here: this stack has no raft sidecar to elect a leader.
    - HA_ENABLED=false
    - HA_NODE_ID=node-1
    - HA_NODE_SECRET=changeme-ha-secret
    - RAFT_URL=http://raft:8000
    #  Change the secret
    - JWT_SECRET=mysecretmysecretmysecretmysecret

